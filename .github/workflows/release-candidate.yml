name: Release candidate validation

on:
  push:
    tags:
      - 'v0.1.0-rc*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.401
      - name: Restore locked .NET graph
        run: ./scripts/restore-locked-dotnet.sh BTCPayServer.Plugins.BTCX.slnx
      - name: Build and test
        run: |
          dotnet build BTCPayServer.Plugins.BTCX.slnx --configuration Release --no-restore
          dotnet test BTCPayServer.Plugins.BTCX.slnx --configuration Release --no-build
      - name: Package BTCX plugin
        run: ./scripts/package-plugin.sh
      - name: Record plugin artifact hash
        run: sha256sum artifacts/plugin-package/BTCPayServer.Plugins.BTCX/0.1.0/* > artifacts/plugin-package/BTCPayServer.Plugins.BTCX/0.1.0/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btcx-btcpay-plugin-${{ github.sha }}
          path: artifacts/plugin-package/BTCPayServer.Plugins.BTCX/0.1.0/
          if-no-files-found: error
          retention-days: 90

  xboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite, sqlite3, xml, zip, bcmath, gd, intl
          tools: composer:2.10.3
      - name: Checkout pinned XBoard API target
        run: |
          git clone --no-checkout https://github.com/cedar2025/Xboard.git /tmp/xboard
          git -C /tmp/xboard fetch --depth=1 origin 4f48e61a2cbc6db5338872b6bdb45ef954ec1256
          git -C /tmp/xboard checkout --detach FETCH_HEAD
          test "$(git -C /tmp/xboard rev-parse HEAD)" = 4f48e61a2cbc6db5338872b6bdb45ef954ec1256
          cp -R integrations/xboard/BtcpayBtcx /tmp/xboard/plugins/BtcpayBtcx
          cd /tmp/xboard
          composer install --no-interaction --prefer-dist --no-progress
      - name: XBoard plugin tests, PHPStan, and syntax
        working-directory: /tmp/xboard
        run: |
          php artisan key:generate --force
          vendor/bin/phpunit --bootstrap vendor/autoload.php plugins/BtcpayBtcx/Tests/BtcpayBtcxPluginTest.php
          vendor/bin/phpstan analyse plugins/BtcpayBtcx/Plugin.php plugins/BtcpayBtcx/database/migrations/2026_09_29_000000_create_btcpay_btcx_tables.php --no-progress
          find plugins/BtcpayBtcx -name '*.php' -print0 | xargs -0 -n1 php -l

  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Install the pinned Rust compiler
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Checkout pinned electrs and bindex sources
        run: |
          git clone --no-checkout https://github.com/PoC-Consortium/bindex-btcx.git /tmp/bindex-btcx
          git -C /tmp/bindex-btcx fetch --depth=1 origin eda7c70660baa06affef464c7ea1e131c39304f1
          git -C /tmp/bindex-btcx checkout --detach FETCH_HEAD
          git clone --no-checkout https://github.com/PoC-Consortium/electrs-btcx.git /tmp/electrs-btcx
          git -C /tmp/electrs-btcx fetch --depth=1 origin 2f78c63e20215e20944767f0901209c4d740fe5b
          git -C /tmp/electrs-btcx checkout --detach FETCH_HEAD
          test -f /tmp/electrs-btcx/Cargo.lock
      - name: Test bindex and electrs with lockfiles
        run: |
          cargo +1.85.1 test --locked --manifest-path /tmp/bindex-btcx/Cargo.toml
          cd /tmp/electrs-btcx
          cargo +1.85.1 test --locked

  production-images:
    runs-on: ubuntu-24.04
    needs: [dotnet, xboard, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Check isolated production Compose model
        run: docker compose --env-file deploy/production/.env.example -f deploy/production/docker-compose.yml config --no-interpolate --quiet
      - name: Check production Dockerfile syntax and build rules
        run: |
          docker buildx build --check -f integrations/production/bitcoin-pocx/Dockerfile .
          docker buildx build --check -f integrations/production/electrs/Dockerfile .
          docker buildx build --check -f integrations/production/btcpay/Dockerfile .
      - name: Build production OCI artifacts with SBOM and provenance
        run: |
          mkdir -p artifacts/production-oci
          build_image() {
            local name="$1" dockerfile="$2"
            docker buildx build --platform linux/amd64 --pull \
              --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")" \
              --build-arg BTCX_BUILD_COMMIT="$GITHUB_SHA" \
              --attest=type=sbom,generator=docker/scout-sbom-indexer@sha256:4b67f29eb0d1244ab0f62de867ac5dafd7262fcd7ebbdefa6ec8aacd6b15252d \
              --provenance=mode=max,version=v1 \
              --metadata-file "artifacts/production-oci/$name-metadata.json" \
              --output "type=oci,dest=artifacts/production-oci/$name.oci.tar,rewrite-timestamp=true" \
              --tag "local.invalid/btcx/$name:${GITHUB_SHA}" \
              --file "$dockerfile" .
            sha256sum "artifacts/production-oci/$name.oci.tar" > "artifacts/production-oci/$name.oci.tar.sha256"
            python3 scripts/verify-oci-attestations.py "artifacts/production-oci/$name.oci.tar"
          }
          build_image bitcoin-pocx integrations/production/bitcoin-pocx/Dockerfile
          build_image electrs-btcx integrations/production/electrs/Dockerfile
          build_image btcpayserver integrations/production/btcpay/Dockerfile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btcx-production-images-sbom-provenance-${{ github.sha }}
          path: artifacts/production-oci/
          if-no-files-found: error
          retention-days: 90
